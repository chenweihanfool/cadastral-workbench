name: Auto Tag on Version Bump

# version.py 的 APP_VERSION 改變並 merge 進 master 時，自動建立對應的
# git tag（vX.Y.Z）並 push——這一步是用 Actions 自己的 GITHUB_TOKEN 執行
# git push，不是本機/agent 憑證，所以不會卡在「網頁建 Release 建 tag
# 不會觸發 push 事件」或「特定憑證被擋 tag push」這些問題。
# tag 一旦被真正 push 上去，會自動觸發 release.yml 的 push:tags 建置流程，
# 全程不需要手動操作。
on:
  push:
    branches: [master]
    paths:
      - 'version.py'

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version from version.py
        id: ver
        run: |
          V=$(grep -oP "(?<=APP_VERSION = ')[^']+" version.py)
          if [ -z "$V" ]; then
            echo "無法從 version.py 讀出 APP_VERSION" >&2
            exit 1
          fi
          echo "tag=v$V" >> "$GITHUB_OUTPUT"

      - name: Create and push tag if it doesn't exist yet
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG 已存在，略過"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"
