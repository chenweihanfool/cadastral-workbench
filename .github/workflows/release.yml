name: Build & Release EXE

on:
  push:
    tags:
      - 'v*.*.*'
    branches: [master]
    paths:
      - 'version.py'
  workflow_dispatch:
    inputs:
      tag:
        description: '要建置的既有 tag（例如 v0.9.8）；留空則依 version.py 目前版號自動建立/使用對應 tag'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 建 tag 跟建置放在同一個 workflow、同一次執行裡依序做完，是刻意的
      # 設計：GitHub 對「用預設 GITHUB_TOKEN push 的東西」有防遞迴機制，
      # 不會拿去觸發其他 workflow（避免 workflow 互相觸發造成無限迴圈），
      # 所以如果拆成兩個 workflow（一個負責建 tag、另一個監聽 push:tags
      # 負責建置），第一個 workflow 建的 tag 永遠叫不動第二個 workflow。
      # 併成一個 workflow 就不會碰到這個限制。
      - name: Determine tag to build
        id: ver
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            V=$(python -c "import re; print(re.search(r\"APP_VERSION = '([^']+)'\", open('version.py', encoding='utf-8').read()).group(1))")
            TAG="v$V"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Ensure tag exists, then checkout it
        shell: bash
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG 已存在，直接使用"
          else
            git tag -a "$TAG" -m "$TAG"
            git push origin "$TAG"
          fi
          git checkout "$TAG"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build EXE
        run: pyinstaller CadastralWorkbench.spec

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          files: dist/CadastralWorkbench.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
